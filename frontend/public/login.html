<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresar — Shemuel Plus</title>
<link rel="icon" type="image/png" href="shemuel-plus-icon.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<main class="auth-shell">
  <section class="auth-card" aria-labelledby="step-title">
    <a class="auth-brand" href="index.html" aria-label="Shemuel Plus, inicio">
      <img src="shemuel-plus-icon.png" alt="" />
      <span class="auth-brand-copy">
        <span class="brand-name">Shemuel Plus</span>
        <span class="brand-tenant" data-tenant-slug>cargando institución…</span>
      </span>
    </a>

    <h1 id="step-title">Ingresa a tu cuenta</h1>
    <p class="auth-subtitle" id="step-description">Usa tu correo institucional para continuar.</p>
    <div class="auth-error" id="error" role="alert" aria-live="polite"></div>

    <form id="email-form">
      <div class="field">
        <label for="email">Correo institucional</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="username"
          placeholder="nombre@institucion.edu.co"
        />
      </div>
      <button class="btn btn-primary auth-submit" id="verify-email" type="submit">Siguiente</button>
    </form>

    <form id="password-form" hidden>
      <div class="auth-email-row">
        <span id="verified-email"></span>
        <button class="auth-change-email" id="change-email" type="button">Cambiar</button>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Ingresa tu contraseña"
        />
      </div>
      <div class="auth-actions">
        <button class="btn btn-ghost" id="back-to-email" type="button">Atrás</button>
        <button class="btn btn-primary auth-submit" id="submit-login" type="submit">Ingresar</button>
      </div>
      <p class="auth-hint">
        Usuario de prueba (datos locales): <code>ana.torres@udi.demo</code> / <code>Practica2026*</code>
      </p>
    </form>

    <form id="change-password-form" hidden>
      <div class="auth-email-row">
        <span id="change-password-email"></span>
      </div>
      <div class="field">
        <label for="new-password">Nueva contraseña</label>
        <input
          type="password"
          id="new-password"
          required
          minlength="10"
          autocomplete="new-password"
          placeholder="Mínimo 10 caracteres"
        />
      </div>
      <div class="field">
        <label for="confirm-password">Confirma la nueva contraseña</label>
        <input
          type="password"
          id="confirm-password"
          required
          minlength="10"
          autocomplete="new-password"
          placeholder="Repite la nueva contraseña"
        />
      </div>
      <button class="btn btn-primary auth-submit" id="submit-password-change" type="submit">Guardar contraseña</button>
    </form>
  </section>
</main>

<script src="js/tenant.js"></script>
<script>
  const emailForm = document.getElementById('email-form');
  const passwordForm = document.getElementById('password-form');
  const changePasswordForm = document.getElementById('change-password-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const newPasswordInput = document.getElementById('new-password');
  const confirmPasswordInput = document.getElementById('confirm-password');
  const errorBox = document.getElementById('error');
  const stepTitle = document.getElementById('step-title');
  const stepDescription = document.getElementById('step-description');
  const verifiedEmail = document.getElementById('verified-email');
  let tokenPendienteCambio = null;

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }

  function tenantSlug() {
    try {
      return detectarTenantSlug();
    } catch (err) {
      showError(err.message);
      return null;
    }
  }

  cargarInstitucion().catch((err) => showError(err.message));

  emailForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideError();

    if (!emailForm.reportValidity()) return;
    const slug = tenantSlug();
    if (!slug) return;

    const button = document.getElementById('verify-email');
    button.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/auth/verificar-correo`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tenant': slug },
        body: JSON.stringify({ email: emailInput.value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No se pudo verificar el correo.');

      emailInput.value = data.email;
      verifiedEmail.textContent = data.email;
      emailForm.hidden = true;
      passwordForm.hidden = false;
      stepTitle.textContent = 'Te damos la bienvenida';
      stepDescription.textContent = 'Ingresa la contraseña de tu cuenta.';
      passwordInput.focus();
    } catch (err) {
      showError(err.message);
    } finally {
      button.disabled = false;
    }
  });

  function volverAlCorreo() {
    hideError();
    passwordInput.value = '';
    passwordForm.hidden = true;
    emailForm.hidden = false;
    stepTitle.textContent = 'Ingresa a tu cuenta';
    stepDescription.textContent = 'Usa tu correo institucional para continuar.';
    emailInput.focus();
  }

  document.getElementById('change-email').addEventListener('click', volverAlCorreo);
  document.getElementById('back-to-email').addEventListener('click', volverAlCorreo);

  passwordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideError();

    if (!passwordForm.reportValidity()) return;
    const slug = tenantSlug();
    if (!slug) return;

    const button = document.getElementById('submit-login');
    button.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tenant': slug },
        body: JSON.stringify({ email: emailInput.value, password: passwordInput.value }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');

      if (data.requiereCambioPassword) {
        tokenPendienteCambio = data.token;
        emailForm.hidden = true;
        passwordForm.hidden = true;
        changePasswordForm.hidden = false;
        document.getElementById('change-password-email').textContent = data.usuario.email;
        stepTitle.textContent = 'Actualiza tu contraseña';
        stepDescription.textContent = 'Por seguridad, debes cambiar la contraseña temporal antes de continuar.';
        newPasswordInput.focus();
        return;
      }

      localStorage.setItem('shemuel_token', data.token);
      localStorage.setItem('shemuel_user', JSON.stringify(data.usuario));
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError(err.message);
      passwordInput.focus();
    } finally {
      button.disabled = false;
    }
  });

  changePasswordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideError();

    if (!changePasswordForm.reportValidity()) return;
    if (newPasswordInput.value !== confirmPasswordInput.value) {
      showError('Las contraseñas nuevas no coinciden.');
      confirmPasswordInput.focus();
      return;
    }

    const slug = tenantSlug();
    if (!slug) return;

    const button = document.getElementById('submit-password-change');
    button.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/auth/cambiar-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${tokenPendienteCambio}`,
          'X-Tenant': slug,
        },
        body: JSON.stringify({
          passwordActual: passwordInput.value,
          passwordNueva: newPasswordInput.value,
        }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No se pudo cambiar la contraseña.');

      localStorage.setItem('shemuel_token', data.token);
      localStorage.setItem('shemuel_user', JSON.stringify(data.usuario));
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError(err.message);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
