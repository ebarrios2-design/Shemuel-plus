<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresar — Shemuel Plus</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <span class="brand-name">Shemuel Plus</span>
    <div class="brand-tenant" data-tenant-slug>cargando institución…</div>
    <h1>Ingresa a tu cuenta</h1>

    <div class="auth-error" id="error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo institucional</label>
        <input type="email" id="email" required placeholder="nombre@institucion.edu.co" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Ingresar</button>
    </form>

    <p class="auth-hint">
      Usuario de prueba (datos semilla): <code>estudiante@udi.demo</code> / <code>Practica2026*</code>
    </p>
  </div>
</div>

<script src="js/tenant.js"></script>
<script>
  cargarInstitucion().catch((err) => console.error(err));

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('error');
    errorBox.style.display = 'none';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const slug = detectarTenantSlug();

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tenant': slug },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');

      localStorage.setItem('shemuel_token', data.token);
      localStorage.setItem('shemuel_user', JSON.stringify(data.usuario));
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
